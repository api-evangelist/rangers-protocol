name: Rangers Protocol
description: 'Rangers Protocol is an EVM-compatible Layer 1 blockchain (Chain ID 2025)
  built for Web3 games and metaverse applications, using a VRF+BLS consensus mechanism
  to handle high-frequency transactions and a heterogeneous relay chain for true cross-chain
  interoperability. It features a virtual-machine ("blockchain virtualization") design,
  an NFT protocol emphasizing data inheritance and reuse, an on-chain oracle, and the
  Grand Guard Safe security tooling. Its native gas token, RPG (Rangers Protocol Gas),
  is also issued as ERC20 on Ethereum and BEP20 on BNB Smart Chain. The developer surface
  is standard Ethereum JSON-RPC plus verification-node operations; it was surfaced as
  a portfolio company of Pantera Capital and enriched into the API Evangelist network.'
